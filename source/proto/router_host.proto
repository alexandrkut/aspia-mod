syntax = "proto3";

option optimize_for = LITE_RUNTIME;

import "router_peer.proto";

package proto.router;

message HostIdRequest
{
    enum Type
    {
        UNKNOWN     = 0;
        NEW_ID      = 1;
        EXISTING_ID = 2;
    }

    Type type     = 1;
    bytes key     = 2;
    bytes hw_id   = 3;
    bool portable = 4;
}

message HostIdResponse
{
    string error_code = 1; // "ok" | "internal_error" | "invalid_data" | "not_found"
    uint64 host_id    = 2;
    bytes key         = 3;
}

message HostCommand
{
    string command_name = 1;
    string params       = 2;
}

message HostTelemetry
{
    string json = 1;
}

message HostConfigResult
{
    string command_name = 1; // Same as the command that produced it.
    string error_code   = 2; // "ok" | "invalid_request" | "invalid_data" | "invalid_entry_id" |
                             // "access_denied" | "not_found" | "conflict" | "internal_error" |
                             // "user_has_sessions" | "last_enabled_user"
    string result       = 3; // JSON: applied values, diff, or a snapshot for rollback.
}

message RouterToHost
{
    HostIdResponse host_id_response  = 1;
    ConnectionOffer connection_offer = 2;
    HostCommand host_command         = 3;
}

message HostToRouter
{
    HostIdRequest host_id_request   = 1;
    HostTelemetry host_telemetry    = 2;
    HostConfigResult host_config_result = 3;
}
